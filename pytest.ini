# Configuration commune aux tests locaux et au job test de GitHub Actions.
[pytest]
testpaths = tests
cache_dir = tests/.pytest_cache
addopts =
    -ra
    --basetemp=tests/.tmp
    --cov=app.main
    --cov=app.prediction
    --cov-branch
    --cov-config=pytest.ini
    --cov-report=term-missing
    --cov-report=json:tests/reports/coverage.json

# Paramètres lus par coverage via --cov-config=pytest.ini.
[run]
branch = True
data_file = tests/reports/.coverage

[json]
output = tests/reports/coverage.json

[html]
directory = tests/reports/htmlcov
