name: API scoring - test build deploy

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IMAGE_TAG: credit-scoring:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Installer les dépendances du projet
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Tests unitaires et intégration Gradio
        run: >-
          .venv/bin/python -m pytest
      - name: Couverture des lignes et des branches par fichier
        if: ${{ always() && hashFiles('tests/reports/coverage.json') != '' }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("tests/reports/coverage.json").read_text())
          print("Fichier | Lignes couvertes | Couverture lignes | Branches couvertes | Couverture branches")
          for filename, details in report["files"].items():
              counts = details["summary"]
              lines = counts["num_statements"]
              branches = counts["num_branches"]
              line_pct = 100 * counts["covered_lines"] / lines if lines else 100
              branch_pct = 100 * counts["covered_branches"] / branches if branches else 100
              print(
                  f"{filename} | {counts['covered_lines']}/{lines} | {line_pct:.2f}% | "
                  f"{counts['covered_branches']}/{branches} | {branch_pct:.2f}%"
              )
          PY

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_id: ${{ steps.image.outputs.id }}
    steps:
      - uses: actions/checkout@v6
      - name: Construire et exporter l'image testée
        id: image
        run: |
          docker build --tag "$IMAGE_TAG" .
          echo "id=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")" >> "$GITHUB_OUTPUT"
          docker save --output "$RUNNER_TEMP/scoring-image.tar" "$IMAGE_TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: scoring-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoring-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          name: scoring-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scoring-image
      - name: Charger exactement l'image produite par build
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          docker load --input "$RUNNER_TEMP/scoring-image/scoring-image.tar"
          actual_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          if [ "$actual_id" != "$EXPECTED_IMAGE_ID" ]; then
            echo "L'image reçue diffère de celle produite par le job build."
            exit 1
          fi
      - name: Démarrer le conteneur sur la boucle locale du runner
        run: |
          mkdir -p "$RUNNER_TEMP/scoring-data"
          chmod 0777 "$RUNNER_TEMP/scoring-data"
          docker run --detach --name credit-scoring-ci --publish 127.0.0.1:7860:7860 --mount "type=bind,source=$RUNNER_TEMP/scoring-data,target=/app/data" "$IMAGE_TAG"
      - name: Attendre puis vérifier schema et predict avec le vrai modèle
        run: python tests/verifier_api_deployee.py --url http://127.0.0.1:7860 --timeout 120
      - name: Démarrer Streamlit avec la même base SQLite en lecture seule
        run: >-
          docker run --detach --name scoring-dashboard-ci
          --publish 127.0.0.1:8501:8501
          --mount "type=bind,source=$RUNNER_TEMP/scoring-data,target=/app/data,readonly"
          "$IMAGE_TAG" python -m streamlit run app/monitoring/dashboard.py
          --server.address=0.0.0.0 --server.port=8501
          --server.headless=true --browser.gatherUsageStats=false
      - name: Vérifier la santé des deux services et la lecture SQLite du dashboard
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          for url in ("http://127.0.0.1:7860/health", "http://127.0.0.1:8501/_stcore/health"):
              deadline = time.monotonic() + 60
              while True:
                  try:
                      with urlopen(url, timeout=3) as response:
                          body = response.read()
                          assert response.status == 200
                          if url.endswith("/health") and ":7860/" in url:
                              assert json.loads(body) == {"status": "ok", "model_loaded": True}
                      break
                  # Un port publié peut réinitialiser la connexion avant que
                  # Streamlit ait fini son démarrage : réessayer jusqu'au délai.
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(1)
              print("Service prêt :", url)
          PY
          docker exec scoring-dashboard-ci python -c "from app.monitoring.analysis import DB_PATH, lire_fenetres; calls, _ = lire_fenetres(DB_PATH, 100); assert calls.status.eq('success').any(), 'Aucune prédiction lisible dans SQLite'; print('Dashboard : SQLite lisible,', len(calls), 'prédiction(s)')"
          docker exec credit-scoring-ci python -c "import os,sqlite3; from contextlib import closing; c=sqlite3.connect(os.environ['API_CALLS_DB_PATH']); r=c.execute(\"SELECT inference_ms,cpu_time_ms,execution_device FROM api_calls WHERE operation='predict' AND status='success' ORDER BY rowid DESC LIMIT 1\").fetchone(); c.close(); assert r and all(v is not None and v>=0 for v in r[:2]) and r[2] in ('cpu','gpu','cuda'), 'Mesures de performance absentes ou invalides'; print('Mesures inference/CPU/backend:',r)"
      - name: T13 - Vérifier la conservation SQLite avec la même image et un volume
        run: python tests/verifier_persistance_docker.py --image "$IMAGE_TAG"
      - name: Journaux du conteneur en cas d'échec
        if: ${{ failure() }}
        run: |
          docker logs --timestamps --tail 200 credit-scoring-ci 2>&1 || true
          docker inspect --format '{{json .State}}' credit-scoring-ci 2>/dev/null || true
          docker logs --timestamps --tail 200 scoring-dashboard-ci 2>&1 || true
      - name: Arrêter et supprimer les deux conteneurs
        if: ${{ always() }}
        run: |
          if docker container inspect credit-scoring-ci >/dev/null 2>&1; then
            docker rm --force credit-scoring-ci
          fi
          if docker container inspect scoring-dashboard-ci >/dev/null 2>&1; then
            docker rm --force scoring-dashboard-ci
          fi
